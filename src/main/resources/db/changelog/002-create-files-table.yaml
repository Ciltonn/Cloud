databaseChangeLog:
  - changeSet:
      id: 002
      author: cloud
      changes:
        - createTable:
            tableName: files
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: path
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: size
                  type: BIGINT
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: file_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: files
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_files_user
            onDelete: CASCADE
        - createIndex:
            tableName: files
            indexName: idx_files_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: files
            indexName: idx_files_name
            columns:
              - column:
                  name: name